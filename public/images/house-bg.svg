<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff3ff"/>
      <stop offset="100%" stop-color="#f0f8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)" />

  <!-- Sun -->
  <circle cx="980" cy="100" r="60" fill="#ffd47a"/>

  <!-- Distant hills -->
  <path d="M0 420 C200 340 400 380 600 420 C800 460 1000 380 1200 420 L1200 600 L0 600 Z" fill="#e6f7e8"/>

  <!-- Trees -->
  <g fill="#67c39a">
    <circle cx="160" cy="380" r="36"/>
    <circle cx="200" cy="360" r="30"/>
    <rect x="152" y="400" width="16" height="50" rx="4" fill="#8bbf8f"/>

    <circle cx="320" cy="420" r="36"/>
    <rect x="312" y="460" width="16" height="40" rx="4" fill="#8bbf8f"/>
  </g>

  <!-- House -->
  <g transform="translate(420,240)">
    <rect x="0" y="60" width="360" height="180" rx="12" fill="#ffffff" stroke="#e6eefb" stroke-width="3"/>
    <polygon points="-20,60 180,-20 380,60" fill="#ffcf6b" stroke="#f6d08a" stroke-width="2"/>
    <rect x="40" y="110" width="80" height="80" rx="8" fill="#ffd6b3"/>
    <rect x="140" y="120" width="80" height="70" rx="8" fill="#cfe8ff"/>
    <rect x="260" y="120" width="60" height="70" rx="8" fill="#d8f3d8"/>
    <rect x="160" y="160" width="40" height="30" rx="4" fill="#856dff"/>
  </g>

  <!-- Path and foreground -->
  <path d="M580 420 L640 520 L560 520 Z" fill="#fff4e6" opacity="0.9"/>
</svg>
